rules:
  # Bronze
  action-setup: done
  appropriate-polling: done
  brands: done
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # Silver
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters:
    status: exempt
    comment: The integration has no options flow.
  docs-installation-parameters: done
  entity-unavailable: done
  integration-owner: done
  log-when-unavailable: done
  parallel-updates: done
  reauthentication-flow: done
  test-coverage: done

  # Gold
  devices: done
  diagnostics: done
  discovery-update-info:
    status: exempt
    comment: Web service, can't be discovered.
  discovery:
    status: exempt
    comment: Web service, can't be discovered.
  docs-data-update: done
  docs-examples: done
  docs-known-limitations: done
  docs-supported-devices:
    status: exempt
    comment: Web service, no devices.
  docs-supported-functions: done
  docs-troubleshooting: done
  docs-use-cases: done
  dynamic-devices:
    status: exempt
    comment: Each config entry has exactly one service device.
  entity-category:
    status: exempt
    comment: All entities show the primary data of the integration.
  entity-device-class: done
  entity-disabled-by-default:
    status: exempt
    comment: All entities show the primary data of the integration.
  entity-translations: done
  exception-translations: done
  icon-translations: done
  reconfiguration-flow: done
  repair-issues:
    status: exempt
    comment: The only user fixable problem, a changed password, is handled by reauth.
  stale-devices:
    status: exempt
    comment: Each config entry has exactly one service device.

  # Platinum
  async-dependency: done
  inject-websession:
    status: todo
    comment: A fresh aiohttp session per login keeps aDISWeb cookies separate.
  strict-typing: done
