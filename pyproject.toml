[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
extend-exclude = ["venv"]

[tool.ruff.lint]
select = [
    "ASYNC", # async pitfalls
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # naive datetimes
    "E",     # pycodestyle
    "F",     # pyflakes
    "G",     # logging format, no f-strings in log calls
    "I",     # import sorting
    "LOG",   # logging
    "PTH",   # pathlib
    "RET",   # return statements
    "RUF",   # ruff specific
    "SIM",   # simplify
    "UP",    # pyupgrade
    "W",     # pycodestyle warnings
]
# Line length is left to the formatter, like in Home Assistant
ignore = ["E501"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]
combine-as-imports = true

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["custom_components/voebb"]
